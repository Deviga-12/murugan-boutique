<!DOCTYPE html>
<html>
<head>
  <title>Booking - Murugan Boutique</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
<form method="POST" action="/booking">
<header>
  <h1>Murugan Boutique - Booking</h1>
</header>

<section class="booking">
  <h2>Book Your Stitching</h2>

  <form>
    <input type="text" name="name" placeholder="Your Name" required><br>
    <input type="text" name="phone" placeholder="Phone Number" required><br>

    <select name="service">
      <option>Select Service</option>
      <option>Blouse Stitching</option>
      <option>half saree</option>
      <option>saree alteration </option>
      <option>Chudidhar</option>
      <option>Bridal Wear</option>
      <option>Aari Work</option>
    </select><br>

    <input type="date" name="date"><br>

    <textarea placeholder="Extra Details" name="details"></textarea><br>

    <button type="submit">Submit Booking</button>
  </form>
</section>

</body>
</html>
